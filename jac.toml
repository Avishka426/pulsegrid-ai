[project]
name = "pulsegrid-ai"
version = "0.1.0"
description = "Agentic Power Grid Incident Intelligence & Recovery Simulator"
entry-point = "main"
kind = "web-app"

[byllm]
[byllm.model]
default_model = "${LLM_MODEL:-gpt-4o-mini}"
api_key = "${OPENAI_API_KEY:-}"


[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "teal"
font = "geist"
radius = "medium"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
"@fontsource-variable/geist" = "*"
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "1.1.10"
"@hugeicons/core-free-icons" = "4.3.3"
"@radix-ui/react-slot" = "1.3.3"
radix-ui = "1.6.7"
class-variance-authority = "0.7.1"
"@fontsource-variable/inter" = "5.3.0"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "1.8.0"
cmdk = "1.1.1"
embla-carousel-react = "8.6.0"
input-otp = "1.5.0"
react-day-picker = "10.0.1"
react-resizable-panels = "4.12.4"
recharts = "3.10.1"
sonner = "2.0.8"
vaul = "1.1.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "4.3.3"
"@tailwindcss/vite" = "4.3.3"



[dev-dependencies.pypi]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "PulseGrid AI"
description = "Synthetic grid incident intelligence and recovery simulator."
keywords = "jac, power grid, incident simulator, AI"
author = "Jaseci Labs Hackathon"
theme_color = "#14b8a6"
og_type = "website"
og_title = "PulseGrid AI"
og_description = "Monitor. Investigate. Recover."
og_site_name = "PulseGrid AI"


[jacpack]
name = 'pulsegrid-ai'
description = 'Jac IDE snapshot for pulsegrid-ai'

[jachammer]
project_id = "prj_8faf5faf35914a5587508f448f73d887"
